<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutería Guerrero</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#2C3540;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.container{text-align:center;padding:30px;}
.logo{font-size:48px;margin-bottom:8px;}
h1{font-size:28px;color:#fff;font-weight:600;margin-bottom:4px;}
.sub{font-size:15px;color:#9CA6AF;margin-bottom:40px;}
.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
a.card{display:block;background:#fff;border:1.5px solid #D9D7D1;border-radius:16px;padding:36px 32px;width:280px;text-decoration:none;color:#22262B;transition:box-shadow .2s;}
a.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.15);}
.card .icon{font-size:44px;margin-bottom:12px;}
.card h2{font-size:20px;font-weight:600;color:#2C3540;margin-bottom:6px;}
.card p{font-size:14px;color:#8B8A83;line-height:1.4;}
.card .badge{display:inline-block;margin-top:14px;background:#45566B;color:#fff;font-size:13px;font-weight:600;padding:6px 16px;border-radius:8px;}
.card.v2 .badge{background:#4B7057;}
</style>
</head>
<body>
<div class="container">
  <div class="logo">🍉</div>
  <h1>Frutería Guerrero</h1>
  <div class="sub">Mercado de Abastos, Ciudad Obregón</div>
  <div class="cards">
    <a class="card" href="vendedor1.html">
      <div class="icon">📋</div>
      <h2>Vendedor 1</h2>
      <p>Toma el pedido del cliente, fija precios y envía la nota.</p>
      <div class="badge">Nota de pedido →</div>
    </a>
    <a class="card v2" href="vendedor2.html">
      <div class="icon">📦</div>
      <h2>Vendedor 2</h2>
      <p>Recibe el pedido, surte la mercancía y marca como completado.</p>
      <div class="badge">Nota de preparación →</div>
    </a>
  </div>
</div>
</body>
</html>
